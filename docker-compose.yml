services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,dynamodb
      - DEFAULT_REGION=eu-west-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh"
      - "localstack-data:/var/lib/localstack"

  # Vector store for the RAG semantic-search layer (Step 0 gate).
  # Mirrors the AWS deploy target (Postgres + pgvector) — keeps the stack single-cloud.
  # LOCAL DEV ONLY: these credentials are throwaway and the port is bound to
  # loopback so the DB is never reachable off this machine. The deployed
  # RDS/Aurora instance takes its credentials from AWS Secrets Manager — no
  # static credentials ship anywhere.
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=resume
      - POSTGRES_PASSWORD=resume
      - POSTGRES_DB=resume_rag
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_rag"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  localstack-data:
  postgres-data:
